    <div class="head-info">
      <div class="title">WorkBuddy2API <span class="ver" id="ver"></span></div>
      <div class="sub" id="serverLine"></div>
    </div>
    <button class="icon-btn" id="btnHide" title="收起（Esc）">−</button>
  </div>

  <!-- 账号 -->
  <div class="section">
    <div class="section-head"><span>账号 <span id="acctCount" class="muted"></span></span></div>
    <div class="add-buttons">
      <button class="btn primary" id="btnAddWB">＋ WorkBuddy</button>
      <button class="btn primary alt" id="btnAddTrae">＋ TraeWork</button>
    </div>
    <div id="acctList" class="acct-list"></div>
    <div id="acctEmpty" class="empty hidden">还没有账号</div>
    <div class="acct-actions-all">
      <button class="btn" id="btnCheckinAll">全部签到</button>
      <button class="btn" id="btnRefreshAll">全部刷新</button>
    </div>
  </div>

  <!-- 自动签到 -->
  <div class="section">
    <div class="section-head"><span>自动签到</span></div>
    <div class="row wrap">
      <div id="hoursBox" class="hours"></div>
      <button class="icon-btn" id="btnAddHour" title="增加一个时间">＋</button>
    </div>
    <div class="hint">签到支持分钟 · 保活 22:00 自动 · 下次 <span id="nextCheckin"></span></div>
  </div>

  <!-- API 监听 -->
  <div class="section">
    <div class="section-head"><span>API 监听</span></div>
    <div class="row">
      <select id="selHost" class="select">
        <option value="127.0.0.1">127.0.0.1（本机）</option>
        <option value="0.0.0.0">0.0.0.0（全部）</option>
        <option value="__custom__">自定义…</option>
      </select>
      <span class="muted">:</span>
      <input id="inPort" class="input port grow" type="number" min="1" max="65535">
    </div>
    <div id="customHostRow" class="row hidden"><input id="inHost" class="input grow" placeholder="如 192.168.1.100" spellcheck="false"></div>
    <div class="row between">
      <span class="muted small">API-Key</span>
      <div id="keyBox">
        <span id="keyVal" class="key-val" title="点击修改"></span>
      </div>
      <div id="keyEdit" class="row hidden">
        <input id="keyInput" class="input grow" spellcheck="false" placeholder="留空 = 不鉴权">
      </div>
    </div>
  </div>

  <!-- 其他 -->
  <div class="section">
    <div class="row between">
      <span>开机自启</span>
      <label class="switch"><input type="checkbox" id="chkAutostart"><span class="slider"></span></label>
    </div>
    <button class="btn block" id="btnLog">查看日志</button>
    <button class="btn block" id="btnAbout">关于软件</button>
  </div>

  <button class="btn danger block" id="btnQuit">退出</button>
</div>

<!-- 登录覆盖层 -->
<div class="overlay hidden" id="loginOverlay">
  <div class="modal">
    <div class="modal-title">添加账号</div>
    <div class="modal-body">
      <div id="loginMsg">已打开浏览器…</div>
      <div class="countdown" id="loginCountdown"></div>
    </div>
    <div class="modal-actions">
      <button class="btn small" id="btnCopyUrl">复制链接</button>
      <button class="btn small danger" id="btnCancelLogin">取消</button>
    </div>
  </div>
</div>

<!-- 删除确认弹层 -->
<div class="overlay hidden" id="confirmOverlay">
  <div class="modal">
    <div class="modal-title">删除账号</div>
    <div class="modal-body" id="confirmMsg">确定删除该账号？</div>
    <div class="modal-actions">
      <button class="btn small" id="btnConfirmCancel">取消</button>
      <button class="btn small danger" id="btnConfirmOk">删除</button>
    </div>
  </div>
</div>

<!-- 关于软件 -->
<div class="overlay hidden" id="aboutOverlay">
  <div class="modal about-modal">
    <div class="modal-title">关于 WorkBuddy2API</div>
    <div class="about-body">
      <div class="about-mark">W<span>²</span></div>
      <div class="about-name">WorkBuddy2API</div>
      <div class="about-meta">WorkBuddy / TraeWork OpenAI 兼容代理</div>
      <div class="about-line"><span>版本</span><strong id="aboutVersion">-</strong></div>
      <div class="about-line"><span>作者</span><strong>rockswang</strong></div>
      <div class="about-line about-link"><span>项目</span><a id="aboutProject" href="https://github.com/rockswang/workbuddy-wild">github.com/rockswang/workbuddy-wild</a></div>
      <div class="about-line"><span>许可</span><strong>MIT License</strong></div>
    </div>
    <div class="modal-actions">
      <button class="btn small" id="btnAboutClose">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="./app.js"></script>
</body>
</html>
