# 打 tag v* 时自动构建 Windows 版并发布到 GitHub Releases
name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手动触发：不带 tag 也可跑（产物为 release artifact）

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go（按 go.mod 版本）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: 生成图标资产
        run: go run ./cmd/genicon

      - name: 构建 Windows amd64
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\go\bin"
          wails build -platform windows/amd64 -skipbindings

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build\bin\workbuddy-wild.exe release\
          Copy-Item config.example.json release\
          Get-ChildItem release | Select-Object Name,Length

      - name: 打包 zip（含 exe + 示例配置）
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          Compress-Archive -Path release\* -DestinationPath "workbuddy-wild-windows-amd64-v$ver.zip"

      - name: 上传构建产物（workflow artifact）
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-wild-windows-amd64
          path: release/*

      - name: 发布 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: workbuddy-wild-windows-amd64-v*.zip
          generate_release_notes: true
          draft: false
