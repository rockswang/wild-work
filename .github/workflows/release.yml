# 打 tag v* 时自动构建多平台并发布到 GitHub Releases
name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手动触发：可指定 tag 或不指定（产物为 dev-build）

permissions:
  contents: write

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
            icon: "-H windowsgui"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            extension: ""
            icon: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            extension: ""
            icon: ""
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ""
            icon: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            extension: ""
            icon: ""
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go（按 go.mod 版本）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags "${{ matrix.icon }} -s -w" -o wild-work${{ matrix.extension }} ./cmd/wild-work

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wild-work-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wild-work${{ matrix.extension }}

  release:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物列表
        run: |
          ls -la artifacts/
          for f in artifacts/*; do
            echo "$f:"
            ls -lh "$f"
          done

      - name: 创建发布（tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wild-work-windows-amd64.exe
            artifacts/wild-work-darwin-arm64
            artifacts/wild-work-darwin-amd64
            artifacts/wild-work-linux-amd64
            artifacts/wild-work-linux-arm64
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: 更新 dev-build 预发布（workflow_dispatch 或 tag 都更新）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wild-work-windows-amd64.exe
            artifacts/wild-work-darwin-arm64
            artifacts/wild-work-darwin-amd64
            artifacts/wild-work-linux-amd64
            artifacts/wild-work-linux-arm64
          tag_name: dev-build
          prerelease: true
          draft: false
          body: |
            ## Dev Build (Latest)
            
            基于最新 `master` 分支的预览版，包含：
            - 系统托盘 daemon + 浏览器 Web UI
            - WorkBuddy + TraeWork + Qoder 三渠道聚合
            - 粘性路由优化（会话缓存利用率提升）
            - TraeWork 积分明细按来源分组显示
            
            ⚠️ **注意**：macOS/Linux 版本为 CI 构建，未经真机测试，请试用者重点反馈相关平台问题。
